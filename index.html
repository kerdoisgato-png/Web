<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>WebBuilder Ultra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='.5' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M28 32l8 36 14-24 14 24 8-36' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Lora:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080f;--text:#f0f0ff;--muted:#8a8aa8;--border:rgba(255,255,255,.07);--accent:#7c3aed;--accent2:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}
button,input,select,textarea{font-family:inherit}
::selection{background:var(--accent);color:#fff}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 0%,rgba(124,58,237,.15),transparent 50%),radial-gradient(circle at 80% 100%,rgba(6,182,212,.12),transparent 50%);pointer-events:none}
.splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#05050a;overflow:auto;padding:24px;transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-card{position:relative;z-index:1;background:rgba(15,15,25,.72);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:48px 44px;width:min(560px,94vw);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.splash-logo{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#06b6d4,#ec4899);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;margin:0 auto 22px;box-shadow:0 20px 50px rgba(124,58,237,.5)}
.splash-title{text-align:center;font-size:30px;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#a78bfa,#06b6d4,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 8px}
.splash-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 32px}
.splash-section{margin-bottom:22px}
.splash-section>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#5c5c7a;font-weight:800;margin-bottom:12px}
.splash-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt-btn{padding:18px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .25s;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.opt-btn.active{background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(6,182,212,.22));border-color:var(--accent)}
.opt-btn .oi{font-size:26px}
.opt-btn .ot{font-size:12.5px;font-weight:600}
.opt-btn .od{font-size:10.5px;color:var(--muted)}
.splash-launch{width:100%;margin-top:8px;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 34px rgba(124,58,237,.5);transition:all .3s}
.splash-launch:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(124,58,237,.65)}
.splash-footer{text-align:center;font-size:11px;color:#5c5c7a;margin-top:22px;font-family:'JetBrains Mono',monospace}
.splash-footer a{color:#a78bfa;text-decoration:none}
.topbar{height:56px;background:rgba(15,15,26,.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:100;position:relative}
.logo{font-weight:900;font-size:16px;background:linear-gradient(90deg,#a78bfa,#06b6d4,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px}
.logo::before{content:'◆';-webkit-text-fill-color:#a78bfa}
.project-name{background:rgba(255,255,255,.03);border:1px solid transparent;color:var(--text);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;width:160px;transition:all .25s}
.project-name:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,.08)}
.spacer{flex:1}
.tb-btn{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;height:38px;transition:all .25s;font-weight:500;white-space:nowrap;text-decoration:none}
.tb-btn:hover{border-color:rgba(139,92,246,.5);transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.2)}
.tb-btn:disabled{opacity:.35;cursor:not-allowed}
.tb-btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;font-weight:600;box-shadow:0 4px 20px rgba(124,58,237,.4);color:#fff}
.tb-btn.primary:hover{box-shadow:0 12px 30px rgba(124,58,237,.55);transform:translateY(-2px) scale(1.02)}
.tb-btn .kbd-hint{font-size:10px;opacity:.5;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:5px}
.segmented{display:flex;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.segmented button{background:transparent;border:none;color:var(--muted);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:14px;transition:all .2s}
.segmented button.active{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff}
.pages-bar{min-height:42px;background:rgba(15,15,26,.5);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:99;position:relative}
.pages-list{display:flex;gap:4px;flex:1;overflow-x:auto;align-items:center;scrollbar-width:none;padding:4px 0}
.pages-list::-webkit-scrollbar{display:none}
.page-tab{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.page-tab:hover{color:var(--text);background:rgba(255,255,255,.06)}
.page-tab.active{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(6,182,212,.2));color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(124,58,237,.25)}
.page-tab .pt-name{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.page-tab .pt-del{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;transition:all .2s}
.page-tab .pt-del:hover{background:#ef4444;color:#fff;transform:scale(1.15)}
.page-add-btn{padding:6px 12px;border-radius:8px;background:rgba(124,58,237,.15);border:1px dashed rgba(124,58,237,.5);color:#a78bfa;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.page-add-btn:hover{background:rgba(124,58,237,.35);color:#fff;border-style:solid}
.page-settings-btn{padding:6px 12px;border-radius:8px;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.4);color:#67e8f9;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.page-settings-btn:hover{background:rgba(6,182,212,.35);color:#fff}
.main{display:flex;height:calc(100vh - 98px)}
.sidebar{width:290px;background:rgba(15,15,26,.6);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column}
.search-box{padding:10px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:12.5px;transition:all .25s}
.search-box input:focus{outline:none;border-color:var(--accent)}
.block-list{flex:1;overflow-y:auto;padding:8px}
.cat-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#5c5c7a;padding:14px 10px 6px;font-weight:800}
.block-btn{width:100%;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.02);border:1px solid transparent;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:12.5px;text-align:left;margin-bottom:3px;transition:all .25s}
.block-btn:hover{background:linear-gradient(90deg,rgba(124,58,237,.15),rgba(6,182,212,.05));border-color:rgba(124,58,237,.4);transform:translateX(4px)}
.block-btn .ico{font-size:16px;width:24px;height:24px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border-radius:7px}
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.canvas-wrap{flex:1;overflow:auto;padding:40px;position:relative}
.canvas-wrap::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);background-size:20px 20px;pointer-events:none;opacity:.7}
.canvas{width:100%;max-width:1100px;background:#fff;color:#111;border-radius:16px;min-height:600px;margin:0 auto;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.7);transition:max-width .35s;position:relative;z-index:1}
.canvas.tablet{max-width:768px}
.canvas.mobile{max-width:400px}
.canvas.empty-state{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#999;padding:80px 20px;min-height:600px}
.canvas.empty-state .em-ico{font-size:90px;margin-bottom:24px;opacity:.5}
.canvas.empty-state h2{color:#333;margin-bottom:10px;font-weight:800;font-size:24px}
.canvas.empty-state p{color:#888;font-size:14px}
.block-item{position:relative;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .2s}
.block-item:hover{outline-color:rgba(124,58,237,.5)}
.block-item.selected{outline:2px solid var(--accent);z-index:5;box-shadow:0 0 0 4px rgba(124,58,237,.15)}
.block-toolbar{position:absolute;top:10px;right:10px;display:none;gap:3px;background:rgba(10,10,18,.9);backdrop-filter:blur(20px);padding:5px;border-radius:12px;z-index:20;align-items:center;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 30px rgba(0,0,0,.5);transform:translateY(-8px);opacity:0;transition:all .3s}
.block-item:hover .block-toolbar,.block-item.selected .block-toolbar{display:flex;transform:translateY(0);opacity:1}
.block-toolbar button{min-width:32px;height:32px;border:none;background:transparent;color:#ccc;cursor:pointer;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;transition:all .2s;font-family:inherit;white-space:nowrap;width:auto}
.block-toolbar button:hover{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff}
.block-toolbar button.del:hover{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.block-toolbar button .tt{font-size:11px}
.inspector{width:340px;background:rgba(15,15,26,.6);backdrop-filter:blur(20px);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.insp-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(124,58,237,.05),transparent)}
.insp-header .inh-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px}
.insp-header .inh-title{font-weight:700;font-size:14px}
.insp-header .inh-sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.insp-tabs{display:flex;padding:6px;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;background:rgba(0,0,0,.15)}
.insp-tab{background:transparent;border:none;color:var(--muted);padding:9px 8px;border-radius:9px;cursor:pointer;font-size:10.5px;flex:1;min-width:56px;white-space:nowrap;font-weight:600;transition:all .2s}
.insp-tab.active{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(6,182,212,.15));color:#fff}
.insp-body{flex:1;overflow-y:auto;padding:16px}
.insp-tabpanel{display:none}
.insp-tabpanel.active{display:block}
.group{margin-bottom:20px}
.group-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#5c5c7a;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.group-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:12.5px;resize:vertical;transition:all .25s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,.08)}
.field input[type=color]{width:100%;height:38px;padding:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.field input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.field .range-val{background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.3);padding:3px 10px;border-radius:6px;font-size:10.5px;color:var(--accent2);font-weight:700;min-width:48px;text-align:center;display:inline-block;font-family:'JetBrains Mono',monospace}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.field.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}
.field .upload-btn{background:linear-gradient(135deg,var(--accent),#5b21b6);border:none;color:#fff;padding:9px 12px;border-radius:9px;font-size:11px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.field .url-row{display:flex;gap:6px}
.field .url-row input{flex:1;min-width:0}
.field .clear-btn{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:12px}
.field .clear-btn:hover{background:rgba(239,68,68,.15);color:#fca5a5}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.field .success-note{margin-top:8px;padding:8px 10px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;font-size:11px;color:#34d399}
.field .preset-videos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.field .preset-videos button{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:8px;font-size:10.5px;cursor:pointer;font-weight:500;transition:all .2s}
.field .preset-videos button:hover{background:rgba(124,58,237,.2);color:#fff;border-color:var(--accent)}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.swatch{width:24px;height:24px;border-radius:8px;cursor:pointer;border:2px solid rgba(255,255,255,.1);transition:all .2s}
.swatch:hover{transform:scale(1.2);border-color:#fff}
.seg-sm{display:flex;background:rgba(255,255,255,.03);border-radius:9px;padding:3px;gap:2px;border:1px solid var(--border)}
.seg-sm button{flex:1;background:transparent;border:none;color:var(--muted);padding:7px 5px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500}
.seg-sm button.active{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.preset-grid.c3{grid-template-columns:repeat(3,1fr)}
.preset-btn{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;background:#fff;position:relative;transition:all .25s;overflow:hidden}
.preset-btn:hover{transform:scale(1.1);border-color:#fff}
.preset-btn.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.preset-btn.active::after{content:'✓';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800}
.preset-btn.wide{aspect-ratio:auto;padding:11px 9px;font-size:11px;font-weight:600;color:var(--text);background:rgba(255,255,255,.04);text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center}
.preset-btn.wide:hover{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(6,182,212,.15));color:#fff}
.preset-btn.wide.active{background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(6,182,212,.25));color:#fff;box-shadow:0 0 0 2px var(--accent)}
.anim-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:420px;overflow-y:auto;padding-right:6px}
.anim-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:11px 9px;cursor:pointer;text-align:center;font-size:10.5px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:600;gap:8px;transition:all .25s}
.anim-item.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(6,182,212,.15))}
.anim-item .preview-box{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#06b6d4);flex-shrink:0}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:180px;overflow-y:auto;padding:8px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid var(--border)}
.icon-pick{aspect-ratio:1;background:transparent;border:none;cursor:pointer;border-radius:7px;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-pick:hover{background:rgba(124,58,237,.2);transform:scale(1.2)}
.array-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.array-item .arr-del{position:absolute;top:9px;right:9px;width:24px;height:24px;background:rgba(255,255,255,.05);border:none;color:var(--muted);cursor:pointer;border-radius:7px;font-size:13px}
.array-item .arr-del:hover{background:#ef4444;color:#fff}
.arr-add{width:100%;background:transparent;border:2px dashed var(--border);color:var(--muted);padding:10px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:500}
.arr-add:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.08)}
.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:2000;pointer-events:none}
.toast{background:rgba(23,23,37,.9);backdrop-filter:blur(20px);border:1px solid var(--border);color:var(--text);padding:14px 20px;border-radius:12px;font-size:12.5px;display:flex;align-items:center;gap:12px;pointer-events:auto;font-weight:600;min-width:220px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:toastIn .35s}
.toast.success{border-left:4px solid #10b981}
.toast.error{border-left:4px solid #ef4444}
.toast.info{border-left:4px solid var(--accent)}
.toast.warn{border-left:4px solid #f59e0b}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:rgba(20,20,32,.95);border:1px solid var(--border);border-radius:20px;padding:28px;width:min(480px,92vw);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.modal h3{margin:0 0 8px;font-size:18px;font-weight:800}
.modal p{margin:0 0 20px;color:var(--muted);font-size:13px}

.b-steps{padding:60px 40px}
.b-steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;max-width:1000px;margin:0 auto;text-align:center}
.b-step-num{width:72px;height:72px;border-radius:50%;color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;border:4px solid #fff}
.b-step h4{margin:0 0 8px;font-size:17px;font-weight:700}
.b-step p{margin:0;opacity:.7;font-size:14px}
.b-progress{padding:60px 40px;max-width:700px;margin:0 auto}
.b-progress-list{display:flex;flex-direction:column;gap:24px}
.b-progress-item{display:flex;flex-direction:column;gap:8px}
.b-progress-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.b-progress-bar{height:12px;background:rgba(0,0,0,.06);overflow:hidden;border-radius:99px}
.b-progress-fill{height:100%;border-radius:99px}
.b-logos{padding:40px;text-align:center}
.b-logos-title{opacity:.5;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin:0 0 24px;font-weight:700}
.b-logos-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:48px;align-items:center}
.b-logo{font-weight:900;font-size:26px;color:#c0c0c0;letter-spacing:-1px}
.b-logo:hover{color:#7c3aed}
.b-quote{padding:80px 40px;max-width:900px;margin:0 auto;text-align:center}
.b-quote blockquote{font-size:28px;line-height:1.45;font-style:italic;opacity:.9;margin:0 0 20px;font-weight:500}
.b-quote cite{opacity:.6;font-size:15px;font-style:normal;font-weight:500}
.b-alert{padding:22px 26px;display:flex;gap:18px;align-items:flex-start;margin:20px 40px;border-radius:14px}
.b-alert-icon{font-size:28px;flex-shrink:0}
.b-alert h4{margin:0 0 6px;font-size:16px;font-weight:700}
.b-alert p{margin:0;opacity:.8;font-size:14px;line-height:1.6}
.b-countdown{padding:60px 40px;text-align:center;color:#fff;position:relative;overflow:hidden}
.b-countdown h2{margin:0 0 28px}
.b-cd-timer{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.b-cd-timer>div{background:rgba(255,255,255,.15);padding:20px 28px;min-width:96px;border-radius:18px;border:1px solid rgba(255,255,255,.2)}
.b-cd-timer span{font-size:44px;font-weight:900;display:block;line-height:1}
.b-cd-timer small{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.85;font-weight:700}
.b-tabs{padding:40px;max-width:800px;margin:0 auto}
.b-tabs-nav{display:flex;gap:4px;border-bottom:2px solid rgba(0,0,0,.08);flex-wrap:wrap}
.b-tab-btn{background:transparent;border:none;padding:14px 22px;cursor:pointer;font-size:14px;font-weight:600;opacity:.6;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.b-tab-btn.active{opacity:1}
.b-tab-panel{padding:26px 0;line-height:1.7;opacity:.85}
.b-blog{padding:60px 40px}
.b-blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;max-width:1100px;margin:0 auto}
.b-blog-card{background:#fff;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);border-radius:18px;color:#111}
.b-blog-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.b-blog-ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.15))}
.b-blog-content{padding:24px}
.b-blog-date{font-size:12px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.b-blog-card h3{margin:0 0 10px;font-size:20px;font-weight:700;color:#111}
.b-blog-card p{margin:0 0 16px;opacity:.7;font-size:14px;color:#555}
.b-code{padding:26px;background:#1e1e2e;color:#c9d1d9;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;margin:20px 40px;border-radius:14px}
.b-code code{white-space:pre}
.b-table-wrap{overflow-x:auto;margin:20px 40px;border-radius:14px}
.b-table{width:100%;border-collapse:collapse;background:#fff;color:#111}
.b-table th{background:#f9fafb;padding:14px 18px;text-align:left;font-weight:700;font-size:14px;border-bottom:2px solid #e5e7eb;color:#111}
.b-table td{padding:14px 18px;border-bottom:1px solid #e5e7eb;font-size:14px;color:#333}
.b-cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:40px}
.b-cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
.b-cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:40px}
.b-cols2>div,.b-cols3>div,.b-cols4>div{background:rgba(0,0,0,.03);padding:28px;border-radius:14px}
.b-contact{padding:60px 40px;max-width:600px;margin:0 auto;text-align:center}
.b-contact h2{margin:0 0 8px}
.b-contact>p{opacity:.7;margin:0 0 32px}
.b-form{display:flex;flex-direction:column;gap:12px;text-align:left}
.b-form input,.b-form textarea{padding:14px 18px;border:1px solid rgba(0,0,0,.1);font-size:14px;font-family:inherit;border-radius:12px;background:#fff;width:100%;color:#111}
.b-form button{display:inline-block;color:#fff;border:none;padding:15px 32px;font-size:15px;font-weight:700;cursor:pointer;border-radius:12px;font-family:inherit;width:auto;align-self:flex-start}
.b-newsletter{padding:60px 40px;text-align:center;background:rgba(0,0,0,.03)}
.b-newsletter h2{margin:0 0 8px}
.b-newsletter>p{opacity:.7;margin:0 0 26px}
.b-newsletter form{display:flex;gap:8px;max-width:500px;margin:0 auto;flex-wrap:wrap}
.b-newsletter input{flex:1;min-width:180px;padding:14px 18px;border:1px solid rgba(0,0,0,.1);font-size:14px;border-radius:12px;background:#fff;color:#111}
.b-newsletter button{color:#fff;border:none;padding:14px 28px;font-weight:700;cursor:pointer;border-radius:12px;font-family:inherit}
.b-contact-cards{padding:70px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;max-width:1100px;margin:0 auto}
.b-cc-card{text-align:center;padding:36px 26px;border-radius:20px;background:#fff;color:#111}
.b-cc-ic{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
.b-cc-card h4{margin:0 0 8px;font-size:17px;font-weight:700;color:#111}
.b-cc-card p{margin:0;opacity:.7;font-size:14px;color:#555}
.b-cta{padding:80px 40px;text-align:center;position:relative;overflow:hidden}
.b-cta h2{margin:0 0 12px;font-size:38px;font-weight:900;position:relative;z-index:1}
.b-cta p{opacity:.85;margin:0 0 28px;font-size:17px;position:relative;z-index:1}
.b-cta-btn{display:inline-block;border:none;color:#fff;padding:16px 42px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;border-radius:14px;position:relative;z-index:1;width:auto}
.b-cta-gradient{padding:100px 40px;text-align:center;color:#fff}
.b-cta-gradient h2{margin:0 0 12px;font-size:48px;font-weight:900}
.b-cta-gradient p{opacity:.95;margin:0 0 32px;font-size:18px}
.b-cta-gradient-btn{display:inline-block;background:#fff;padding:16px 42px;font-size:15px;font-weight:800;text-decoration:none;border-radius:14px;width:auto}
.b-cta-banner{margin:20px 40px;padding:60px 44px;border-radius:26px;display:flex;align-items:center;justify-content:space-between;gap:34px;flex-wrap:wrap;color:#fff}
.b-cb-text{flex:1;min-width:240px}
.b-cb-text h2{margin:0 0 8px;font-size:34px;font-weight:900;line-height:1.15}
.b-cb-text p{margin:0;opacity:.9;font-size:16px}
.b-cb-btn{display:inline-block;background:#fff;color:#111;padding:16px 36px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap;width:auto}
.b-download{padding:70px 40px;text-align:center;background:rgba(0,0,0,.03);border-radius:24px;margin:20px 40px}
.b-download h2{margin:0 0 10px;font-size:38px;font-weight:900}
.b-download p{opacity:.7;margin:0 0 28px}
.b-download-btn{display:inline-block;padding:18px 44px;border-radius:14px;font-weight:800;text-decoration:none;font-size:15px;width:auto}
.b-products{padding:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.b-product{background:#fff;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);border-radius:18px;color:#111}
.b-product img{width:100%;aspect-ratio:1;object-fit:cover}
.b-product-ph{aspect-ratio:1;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.15));display:flex;align-items:center;justify-content:center;font-size:64px}
.b-product-info{padding:20px}
.b-product-info h4{margin:0 0 10px;font-size:16px;font-weight:700;color:#111}
.b-product-price{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.b-product-price span{font-size:24px;font-weight:900}
.b-product-price s{color:#999;font-size:14px}
.b-product button{display:inline-block;color:#fff;border:none;padding:13px 24px;font-weight:700;cursor:pointer;font-size:14px;border-radius:12px;font-family:inherit;width:auto}
.b-image-text{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:60px 40px;align-items:center;max-width:1100px;margin:0 auto}
.b-image-text.image-text-right .b-it-img{order:2}
.b-it-img img{width:100%;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.15)}
.b-it-ph{aspect-ratio:4/3;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.15));display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:18px}
.b-it-text h2{margin:0 0 16px;font-size:36px;font-weight:900}
.b-it-text p{margin:0;opacity:.8;line-height:1.7;font-size:16px}
.b-compare{padding:60px 40px;max-width:900px;margin:0 auto}
.b-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.b-compare-col{padding:32px 28px;border-radius:18px;border:2px solid}
.b-compare-col.good{border-color:#10b981;background:rgba(16,185,129,.05)}
.b-compare-col.bad{border-color:#ef4444;background:rgba(239,68,68,.05)}
.b-compare-col h4{margin:0 0 18px;font-size:19px}
.b-compare-col ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.b-compare-col li{font-size:15px;line-height:1.5}
.b-marquee{overflow:hidden;padding:24px 0;border-radius:14px;margin:20px 40px}
.b-marquee-track{display:flex;gap:60px;animation:b-marquee 25s linear infinite;white-space:nowrap;padding-left:60px;width:max-content}
.b-marquee-track span{font-weight:900;font-size:26px;letter-spacing:-1px}
@keyframes b-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.b-map{padding:20px 40px}
.b-map iframe{width:100%;display:block}
.b-map-addr{margin-top:14px;font-size:14px;opacity:.7}
.b-social{padding:40px;text-align:center}
.b-social h3{margin:0 0 18px}
.b-social-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.b-social-links a{text-decoration:none;font-weight:600;padding:11px 22px;border:1px solid rgba(0,0,0,.1);border-radius:11px;display:inline-block}
.b-footer{padding:40px;text-align:center;color:#111}
.b-footer-links{display:flex;gap:22px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.b-footer-links a{color:#111;text-decoration:none;font-size:14px;opacity:.7}
.b-footer-links a.active-page{opacity:1;font-weight:700}
.b-footer p{margin:0;font-size:13px;opacity:.6;color:#111}
.b-footer-big{background:#0a0a12;color:#e5e7eb;padding:70px 40px 28px}
.b-fb-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:44px;max-width:1100px;margin:0 auto 44px}
.b-fb-brand-name{font-size:28px;font-weight:900;margin-bottom:14px;color:#fff}
.b-fb-brand p{opacity:.6;font-size:14px;line-height:1.6;margin:0;color:#e5e7eb}
.b-fb-col h4{margin:0 0 18px;font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1.5px}
.b-fb-col a{display:block;color:#9ca3af;text-decoration:none;font-size:14px;padding:7px 0}
.b-fb-col a.active-page{color:#fff;font-weight:700}
.b-fb-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:26px;text-align:center;font-size:13px;opacity:.5;max-width:1100px;margin:0 auto;color:#e5e7eb}
.b-hero-video{position:relative;min-height:520px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.b-hero-video video,.b-hero-video iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;z-index:0;pointer-events:none}
.b-hero-video .hv-overlay{position:absolute;inset:0;z-index:1}
.b-hero-video .hv-content{position:relative;z-index:2;padding:60px 40px;max-width:800px}
.b-hero-video h1{font-size:56px;font-weight:900;margin:0 0 20px;line-height:1.1}
.b-hero-video p{font-size:19px;opacity:.95;margin:0 0 30px}
.b-hero-video .hv-btn{display:inline-block;background:#fff;color:#111;padding:15px 36px;border-radius:14px;font-weight:700;text-decoration:none;transition:all .3s;width:auto}
.b-hero-video .hv-btn:hover{transform:translateY(-3px)}
.b-parallax{min-height:420px;background-attachment:fixed;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;position:relative;padding:80px 40px}
.b-parallax .pr-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.b-parallax-content{position:relative;z-index:1;max-width:800px}
.b-parallax h2{font-size:48px;font-weight:900;margin:0 0 16px}
.b-parallax p{font-size:18px;opacity:.95;margin:0}
.b-bento{padding:60px 40px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(170px,auto);gap:16px;max-width:1100px;margin:0 auto}
.b-bento-item{padding:28px;border-radius:20px;background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(6,182,212,.05));border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:flex-end;transition:all .3s;position:relative;overflow:hidden;color:#111}
.b-bento-item:hover{transform:translateY(-6px);box-shadow:0 25px 50px rgba(124,58,237,.18)}
.b-bento-item .bi-ico{font-size:38px;margin-bottom:14px}
.b-bento-item h3{font-size:20px;font-weight:800;margin:0 0 8px}
.b-bento-item p{font-size:14px;opacity:.75;margin:0}
.b-bento-item.span2{grid-column:span 2}
.b-bento-item.row2{grid-row:span 2}
.b-flip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;padding:60px 40px;max-width:1100px;margin:0 auto}
.b-flip-card{perspective:1000px;aspect-ratio:1;cursor:pointer}
.b-flip-inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.b-flip-card:hover .b-flip-inner{transform:rotateY(180deg)}
.b-flip-front,.b-flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;color:#fff}
.b-flip-front{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
.b-flip-back{background:linear-gradient(135deg,#0f172a,#1e293b);transform:rotateY(180deg)}
.b-flip-front .fc-ico,.b-flip-back .fc-ico{font-size:56px;margin-bottom:16px}
.b-flip-front h3,.b-flip-back h3{font-size:22px;font-weight:800;margin:0}
.b-flip-back p{font-size:14px;opacity:.85;margin:0;line-height:1.6}
.b-counter{padding:70px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;text-align:center;background:linear-gradient(135deg,rgba(124,58,237,.06),rgba(6,182,212,.04))}
.b-counter-item .ci-num{font-size:72px;font-weight:900;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.b-counter-item .ci-label{font-size:15px;opacity:.7;margin-top:10px;font-weight:600}
.b-typing{padding:80px 40px;text-align:center}
.b-typing .tp-prefix{font-size:44px;font-weight:900;margin-bottom:16px;line-height:1.2}
.b-typing .tp-text{background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.b-typing .tp-cursor{display:inline-block;width:3px;height:.9em;background:#7c3aed;animation:tpcursor 1s infinite;vertical-align:-.05em;margin-left:4px}
@keyframes tpcursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.b-avatars{padding:40px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
.b-avatars .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;border:3px solid #fff;margin-left:-14px;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.b-avatars .av:first-child{margin-left:0}
.b-avatars .av:hover{transform:translateY(-6px);z-index:10}
.b-avatars .av-extra{background:#0f172a;font-weight:700;font-size:14px}
.b-profile{padding:60px 40px;max-width:520px;margin:0 auto;text-align:center}
.b-profile .pf-avatar{width:140px;height:140px;border-radius:50%;margin:0 auto 22px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;overflow:hidden;box-shadow:0 20px 50px rgba(124,58,237,.35)}
.b-profile .pf-avatar img{width:100%;height:100%;object-fit:cover}
.b-profile h2{font-size:32px;font-weight:900;margin:0 0 6px}
.b-profile .pf-role{color:#7c3aed;font-weight:700;margin-bottom:14px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.b-profile .pf-bio{opacity:.75;line-height:1.7;margin:0 0 24px}
.b-profile .pf-stats{display:flex;justify-content:center;gap:30px;margin-bottom:24px}
.b-profile .pf-stat .ps-num{font-size:24px;font-weight:900;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.b-profile .pf-stat .ps-lbl{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.b-profile .pf-btn{display:inline-block;padding:13px 32px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;width:auto}
.b-chat{padding:40px;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.b-chat .ch-msg{display:flex;gap:12px;align-items:flex-end}
.b-chat .ch-msg.you{flex-direction:row-reverse}
.b-chat .ch-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.b-chat .ch-bubble{padding:14px 18px;border-radius:18px;background:#f3f4f6;color:#111;max-width:70%;font-size:14.5px;line-height:1.5}
.b-chat .ch-msg.you .ch-bubble{background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff}
.b-chat .ch-time{font-size:10.5px;opacity:.6;display:block;margin-top:6px}
.b-kanban{padding:60px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1200px;margin:0 auto;align-items:start}
.b-kanban-col{background:rgba(0,0,0,.03);border-radius:16px;padding:18px}
.b-kanban-col h4{margin:0 0 14px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.b-kanban-col h4 .count{background:rgba(124,58,237,.15);color:#7c3aed;padding:3px 10px;border-radius:99px;font-size:11px}
.b-kanban-card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:14px;color:#111;border-left:3px solid #7c3aed;transition:all .2s}
.b-kanban-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.15)}
.b-rating{padding:60px 40px;text-align:center;max-width:600px;margin:0 auto}
.b-rating h3{margin:0 0 16px;font-size:24px;font-weight:800}
.b-rating .rt-stars{display:flex;justify-content:center;gap:6px;font-size:44px;margin-bottom:14px;color:#fbbf24;line-height:1}
.b-rating .rt-stars .star{transition:transform .2s;cursor:pointer}

function getCurrentOrigin(){try{return (location.origin&&location.origin!=='null'&&location.origin!=='file://')?location.origin:'';}catch(e){return '';}}
function extractYouTubeId(url){
  if(!url)return '';
  const s=String(url).trim();
  const m=s.match(/(?:youtube\.com\/watch\?(?:[^&]*&)*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:'';
}
function extractRutubeId(url){
  if(!url)return '';
  const s=String(url).trim();
  const m=s.match(/rutube\.ru\/(?:video|shorts)\/([a-f0-9]+)/i)||s.match(/rutube\.ru\/play\/embed\/([a-f0-9]+)/i);
  return m?m[1]:'';
}
function extractVkIds(url){
  if(!url)return null;
  const s=String(url).trim();
  const m=s.match(/vk(?:video)?\.(?:com|ru)\/video(-?\d+)_(\d+)/)||s.match(/vk\.com\/video_ext\.php\?oid=(-?\d+)&id=(\d+)/);
  return m?{oid:m[1],id:m[2]}:null;
}
function extractDzenId(url){
  if(!url)return '';
  const s=String(url).trim();
  const m=s.match(/dzen\.ru\/video\/watch\/([a-z0-9]+)/i)||s.match(/dzen\.ru\/embed\/([a-z0-9]+)/i);
  return m?m[1]:'';
}
function extractVimeoId(url){
  if(!url)return '';
  const m=String(url).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m?m[1]:'';
}
function buildVideoEmbed(b){
  const rawUrl=String(b.url||'').trim();
  const proxy=String(b.proxy||'').trim();
  if(!rawUrl)return null;
  const origin=getCurrentOrigin();
  const ytId=extractYouTubeId(rawUrl);
  if(ytId){
    let originParam=origin?'&origin='+encodeURIComponent(origin):'';
    let startParam='';
    const tMatch=rawUrl.match(/[?&]t=(\d+)/);
    if(tMatch)startParam='&start='+tMatch[1];
    if(proxy){
      let base=proxy;if(!base.endsWith('/'))base+='/';
      return {type:'iframe',src:base+ytId+'?rel=0&modestbranding=1&playsinline=1'+startParam+originParam};
    }
    return {type:'iframe',src:'https://www.youtube.com/embed/'+ytId+'?rel=0&modestbranding=1&playsinline=1&enablejsapi=0'+startParam+originParam};
  }
  const rtId=extractRutubeId(rawUrl);
  if(rtId)return {type:'iframe',src:'https://rutube.ru/play/embed/'+rtId+'?p=1'};
  const vk=extractVkIds(rawUrl);
  if(vk)return {type:'iframe',src:'https://vk.com/video_ext.php?oid='+vk.oid+'&id='+vk.id+'&hd=2&autoplay=0'};
  const dzId=extractDzenId(rawUrl);
  if(dzId)return {type:'iframe',src:'https://dzen.ru/embed/'+dzId};
  const vmId=extractVimeoId(rawUrl);
  if(vmId)return {type:'iframe',src:'https://player.vimeo.com/video/'+vmId};
  return {type:'video',src:rawUrl};
}

function render(){
  const canvas=$('#canvas');
  const blocks=getBlocks();
  const page=currentPage();
  const ps=page.settings||defaultPageSettings;
  canvas.className='canvas';
  if(state.device==='tablet')canvas.classList.add('tablet');
  if(state.device==='mobile')canvas.classList.add('mobile');
  canvas.style.fontFamily=ps.font||state.theme.font;

  canvas.style.color=ps.text||state.theme.text;

function wireCanvas(canvas){
  $$('.block-item',canvas).forEach(el=>{
    const id=el.dataset.id;
    el.addEventListener('click',e=>{
      if(e.target.closest('.block-toolbar'))return;
      if(e.target.closest('a,button,input,textarea,details,summary,video,select,iframe'))return;
      state.selectedBlockId=id;state.showPageSettings=false;render();renderInspector();
    });
    $$('.block-toolbar button[data-act]',el).forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const a=btn.dataset.act;
        if(a==='up')moveBlock(id,-1);
        else if(a==='down')moveBlock(id,1);
        else if(a==='dup')dupBlock(id);
        else if(a==='copy'){clipboard=deepCopy(getBlocks().find(b=>b.id===id));toast('Скопировано','info');}
        else if(a==='del')delBlock(id);
      });
    });
  });
  $$('.b-tabs',canvas).forEach(tabs=>{
    $$('.b-tab-btn',tabs).forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const i=btn.dataset.tabI;
        $$('.b-tab-btn',tabs).forEach(b=>{const a=b.dataset.tabI===i;b.classList.toggle('active',a);b.style.color=a?state.theme.primary:'';b.style.borderBottomColor=a?state.theme.primary:'';});
        $$('.b-tab-panel',tabs).forEach(p=>{p.style.display=p.dataset.tabP===i?'block':'none';});
      });
    });
  });
  $$('.b-vtabs',canvas).forEach(vt=>{
    vt.querySelectorAll('.b-vtabs-nav button').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const i=btn.dataset.vtI;
        vt.querySelectorAll('.b-vtabs-nav button').forEach(b=>b.classList.toggle('active',b.dataset.vtI===i));
        vt.querySelectorAll('.b-vtabs-panel').forEach(p=>p.style.display=p.dataset.vtP===i?'block':'none');
      });
    });
  });
  $$('.b-feature-tabs',canvas).forEach(block=>{
    $$('.b-ft-btn',block).forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const i=btn.dataset.ftI;
        $$('.b-ft-btn',block).forEach(b=>b.classList.toggle('active',b.dataset.ftI===i));
        $$('.b-ft-panel',block).forEach(p=>p.classList.toggle('active',p.dataset.ftP===i));
      });
    });
  });
  $$('.b-carousel',canvas).forEach(car=>{
    const track=car.querySelector('.b-carousel-track');
    const slides=car.querySelectorAll('.b-carousel-slide');
    const dots=car.querySelectorAll('.b-carousel-nav button');
    let idx=0;
    const go=(n)=>{idx=(n+slides.length)%slides.length;track.style.transform='translateX(-'+(idx*100)+'%)';dots.forEach((d,i)=>d.classList.toggle('active',i===idx));};
    car.querySelectorAll('[data-car-prev]').forEach(b=>b.onclick=e=>{e.stopPropagation();go(idx-1);});
    car.querySelectorAll('[data-car-next]').forEach(b=>b.onclick=e=>{e.stopPropagation();go(idx+1);});
    dots.forEach((d,i)=>d.onclick=e=>{e.stopPropagation();go(i);});
  });
  $$('.b-counter',canvas).forEach(c=>{
    c.querySelectorAll('.ci-num').forEach(num=>{
      const target=parseFloat(num.dataset.target)||0;
      const suffix=num.dataset.suffix||'';
      let cur=0;const step=Math.max(1,target/60);
      if(num._timer)clearInterval(num._timer);
      num._timer=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(num._timer);}num.textContent=Math.round(cur)+suffix;},30);
    });
  });
  $$('.b-typing',canvas).forEach(el=>{
    const texts=(el.dataset.texts||'').split('|').filter(Boolean);
    if(!texts.length)return;
    const target=el.querySelector('.tp-text');
    if(!target)return;
    if(el._timer)clearTimeout(el._timer);
    let i=0,j=0,del=false;
    const tick=()=>{
      const t=texts[i];
      if(!del){target.textContent=t.slice(0,++j);if(j>=t.length){del=true;el._timer=setTimeout(tick,1500);return;}}
      else{target.textContent=t.slice(0,--j);if(j<=0){del=false;i=(i+1)%texts.length;}}
      el._timer=setTimeout(tick,del?50:110);
    };
    tick();
  });
  $$('.b-countdown',canvas).forEach(el=>{
    const target=new Date(el.dataset.date).getTime();
    if(isNaN(target))return;
    if(el._timer)clearInterval(el._timer);
    const upd=()=>{const d=target-Date.now();if(d<=0)return;const dd=el.querySelector('.cd-d'),hh=el.querySelector('.cd-h'),mm=el.querySelector('.cd-m'),ss=el.querySelector('.cd-s');if(dd)dd.textContent=String(Math.floor(d/86400000)).padStart(2,'0');if(hh)hh.textContent=String(Math.floor(d/3600000)%24).padStart(2,'0');if(mm)mm.textContent=String(Math.floor(d/60000)%60).padStart(2,'0');if(ss)ss.textContent=String(Math.floor(d/1000)%60).padStart(2,'0');};
    upd();el._timer=setInterval(upd,1000);
  });
  $$('.bnd-menu',canvas).forEach(m=>{
    const btn=m.querySelector('button');
    if(btn)btn.addEventListener('click',e=>{e.stopPropagation();m.classList.toggle('open');});
  });
}
function addBlock(type){
  const def=BLOCKS[type];
  if(!def)return;
  const b=def.defaults();
  b.type=type;b.id=uid();b._style={};
  getBlocks().push(b);
  state.selectedBlockId=b.id;
  state.showPageSettings=false;
  render();renderInspector();pushHistory();
  toast('«'+def.name+'» добавлен','success');
}
function delBlock(id){const blocks=getBlocks();const i=blocks.findIndex(b=>b.id===id);if(i<0)return;blocks.splice(i,1);if(state.selectedBlockId===id)state.selectedBlockId=null;render();renderInspector();pushHistory();toast('Удалено','info');}
function dupBlock(id){const blocks=getBlocks();const i=blocks.findIndex(b=>b.id===id);if(i<0)return;const c=deepCopy(blocks[i]);c.id=uid();blocks.splice(i+1,0,c);state.selectedBlockId=c.id;render();renderInspector();pushHistory();toast('Дублировано','success');}
function moveBlock(id,dir){const blocks=getBlocks();const i=blocks.findIndex(b=>b.id===id);if(i<0)return;const n=i+dir;if(n<0||n>=blocks.length)return;const tmp=blocks[i];blocks[i]=blocks[n];blocks[n]=tmp;render();pushHistory();}
function showModal(html){

}
function addPages(){
  const ov=showModal('<h3>Создать страницы</h3><p>Введи названия страниц — по одному на строку или через запятую</p><textarea id="bulkPagesInput" placeholder="Главная&#10;О нас&#10;Услуги&#10;Контакты"></textarea><div class="modal-actions"><button class="modal-btn" id="bulkCancel">Отмена</button><button class="modal-btn primary" id="bulkConfirm">Создать</button></div>');
  $('#bulkCancel',ov).onclick=()=>ov.remove();
  $('#bulkConfirm',ov).onclick=()=>{
    const val=$('#bulkPagesInput',ov).value;
    const names=val.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    if(!names.length){toast('Введи хотя бы одно название','warn');return;}
    let created=0;
    names.forEach(name=>{
      let slug=slugify(name);
      let base=slug,i=2;
      while(findPageBySlug(slug)){slug=base+'-'+i;i++;}
      const p=newPage(name);
      p.slug=slug;
      state.pages.push(p);
      created++;
    });
    ov.remove();
    renderPagesBar();
    pushHistory();
    toast('Создано страниц: '+created,'success');
  };
  setTimeout(()=>{const inp=$('#bulkPagesInput',ov);if(inp)inp.focus();},50);
}
function addPage(){
  const name=prompt('Название новой страницы:','Новая страница');
  if(!name)return;
  let slug=slugify(name);
  let base=slug,i=2;
  while(findPageBySlug(slug)){slug=base+'-'+i;i++;}
  const p=newPage(name);
  p.slug=slug;
  state.pages.push(p);
  state.currentPageId=p.id;
  state.selectedBlockId=null;
  state.showPageSettings=false;
  renderPagesBar();render();renderInspector();pushHistory();
  toast('Страница добавлена','success');
}
function delPage(id){
  if(state.pages.length<=1){toast('Нельзя удалить последнюю страницу','warn');return;}
  const p=state.pages.find(x=>x.id===id);
  if(!p)return;
  if(!confirm('Удалить страницу «'+p.name+'»?'))return;
  state.pages=state.pages.filter(x=>x.id!==id);
  if(state.currentPageId===id){state.currentPageId=state.pages[0].id;state.selectedBlockId=null;}
  renderPagesBar();render();renderInspector();pushHistory();
  toast('Страница удалена','info');
}
function renamePage(id){
  const p=state.pages.find(x=>x.id===id);
  if(!p)return;
  const name=prompt('Новое название:',p.name);
  if(!name||name===p.name)return;
  p.name=name;
  let slug=slugify(name);
  let base=slug,i=2;
  while(state.pages.some(x=>x.id!==id&&x.slug===slug)){slug=base+'-'+i;i++;}
  p.slug=slug;
  renderPagesBar();render();pushHistory();
  toast('Переименовано','success');
}
function switchPage(id){
  if(state.currentPageId===id){state.showPageSettings=false;renderInspector();return;}
  state.currentPageId=id;
  state.selectedBlockId=null;
  state.showPageSettings=false;
  renderPagesBar();render();renderInspector();
}
function renderPagesBar(){
  const list=$('#pagesList');

    const active=p.id===state.currentPageId;
    return '<div class="page-tab '+(active?'active':'')+'" data-page-id="'+p.id+'">'+
      '<span class="pt-name" data-page-name="'+p.id+'" title="Двойной клик для переименования">'+esc(p.name)+'</span>'+
      (state.pages.length>1?'<span class="pt-del" data-page-del="'+p.id+'" title="Удалить">✕</span>':'')+
    '</div>';

  $$('.page-tab',list).forEach(tab=>{

  $$('[data-page-del]',list).forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();delPage(btn.dataset.pageDel);});});
}

function pickImage(cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cb(r.result);toast('Загружено','success');};r.readAsDataURL(f);};
  inp.click();
}
function pickVideo(cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='video/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const maxMB=20;
    if(f.size>maxMB*1024*1024){
      if(!confirm('Файл '+(f.size/1024/1024).toFixed(1)+' МБ — это увеличит итоговый HTML. Продолжить?'))return;
    }
    const r=new FileReader();
    r.onload=()=>{cb(r.result);toast('Видео загружено (~'+(f.size/1024/1024).toFixed(1)+' МБ)','success');};
    r.onerror=()=>toast('Ошибка чтения файла','error');
    r.readAsDataURL(f);
  };
  inp.click();
}
function toast(msg,type){
  type=type||'info';
  const c=$('#toastContainer');
  const el=document.createElement('div');
  el.className='toast '+type;
  const icons={success:'✓',error:'✕',info:'ℹ',warn:'⚠'};
  el.innerHTML='<span>'+icons[type]+'</span> '+esc(msg);
  c.appendChild(el);
  setTimeout(()=>{el.style.transition='all .35s';el.style.opacity='0';el.style.transform='translateX(120%)';setTimeout(()=>el.remove(),350);},2400);
}

      if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
      else if(e.key==='y'){e.preventDefault();redo();}
      else if(e.key==='v'&&clipboard&&!inInput){e.preventDefault();const c=deepCopy(clipboard);c.id=uid();const blocks=getBlocks();const i=blocks.findIndex(b=>b.id===state.selectedBlockId);const at=i>=0?i+1:blocks.length;blocks.splice(at,0,c);state.selectedBlockId=c.id;state.showPageSettings=false;render();renderInspector();pushHistory();toast('Вставлено','success');}
      else if(e.key==='c'&&state.selectedBlockId&&!inInput){e.preventDefault();clipboard=deepCopy(getBlocks().find(b=>b.id===state.selectedBlockId));toast('Скопировано','info');}
    }else if(e.key==='Delete'&&state.selectedBlockId&&!inInput){e.preventDefault();delBlock(state.selectedBlockId);}
  });
  setTimeout(updateDownloadLink,100);
}
try{init();}catch(err){console.error('Init error:',err);}
</script>
</body>
