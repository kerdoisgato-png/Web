<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebBuilder Ultra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='.5' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M28 32l8 36 14-24 14 24 8-36' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='78' cy='24' r='6' fill='white' opacity='.9'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Lora:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080f;--bg2:#0f0f1a;--bg3:#171725;--bg4:#222232;--border:rgba(255,255,255,.07);--border-hi:rgba(139,92,246,.5);--text:#f0f0ff;--muted:#8a8aa8;--muted2:#5c5c7a;--accent:#7c3aed;--accent2:#06b6d4;--accent3:#ec4899;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--glow:0 0 40px rgba(124,58,237,.5)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
::selection{background:var(--accent);color:#fff}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 0%,rgba(124,58,237,.15),transparent 50%),radial-gradient(circle at 80% 100%,rgba(6,182,212,.12),transparent 50%),radial-gradient(circle at 50% 50%,rgba(236,72,153,.06),transparent 70%);pointer-events:none;animation:bgShift 20s ease-in-out infinite}
@keyframes bgShift{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(3deg)}}

.splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#05050a;overflow:auto;padding:24px;transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(124,58,237,.35),transparent 45%),radial-gradient(circle at 80% 80%,rgba(6,182,212,.28),transparent 45%),radial-gradient(circle at 50% 100%,rgba(236,72,153,.18),transparent 50%);animation:bgShift 18s ease-in-out infinite;pointer-events:none}
.splash-card{position:relative;z-index:1;background:rgba(15,15,25,.72);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:48px 44px;width:min(560px,94vw);box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);animation:splashIn .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes splashIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.splash-logo{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#06b6d4,#ec4899);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;margin:0 auto 22px;box-shadow:0 20px 50px rgba(124,58,237,.5);animation:floatIcon 4s ease-in-out infinite}
.splash-title{text-align:center;font-size:30px;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#a78bfa,#06b6d4,#ec4899,#a78bfa);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientFlow 6s linear infinite;margin:0 0 8px}
.splash-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 32px;line-height:1.5}
.splash-section{margin-bottom:22px}
.splash-section>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted2);font-weight:800;margin-bottom:12px}
.splash-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.lang-btn:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.lang-btn.active{background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(6,182,212,.25));border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18),0 8px 20px rgba(124,58,237,.3)}
.lang-btn .flag{font-size:13px;font-weight:900;letter-spacing:.5px;background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(6,182,212,.25));padding:4px 9px;border-radius:6px;font-family:'JetBrains Mono',monospace}
.splash-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt-btn{padding:18px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.opt-btn:hover{background:rgba(255,255,255,.08);transform:translateY(-3px);border-color:var(--border-hi)}
.opt-btn.active{background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(6,182,212,.22));border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.opt-btn .oi{font-size:26px}
.opt-btn .ot{font-size:12.5px;font-weight:600;line-height:1.3}
.opt-btn .od{font-size:10.5px;color:var(--muted);line-height:1.3}
.splash-launch{width:100%;margin-top:8px;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 34px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.2);transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.splash-launch:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 22px 50px rgba(124,58,237,.65),inset 0 1px 0 rgba(255,255,255,.2)}
.splash-launch:active{transform:translateY(0) scale(.99)}
.splash-launch::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);pointer-events:none}
.splash-launch:hover::after{animation:shimmer 1s ease forwards}
.splash-footer{text-align:center;font-size:11px;color:var(--muted2);margin-top:22px;font-family:'JetBrains Mono',monospace}
@media(max-width:480px){
.splash-card{padding:34px 22px;border-radius:22px}
.splash-title{font-size:24px}
.splash-logo{width:64px;height:64px;font-size:30px}
.splash-options{grid-template-columns:1fr}
}

.topbar{height:56px;background:rgba(15,15,26,.7);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:100;position:relative;box-shadow:0 4px 30px rgba(0,0,0,.4)}
.logo{font-weight:900;font-size:16px;letter-spacing:-.5px;background:linear-gradient(90deg,#a78bfa,#06b6d4,#ec4899,#a78bfa);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;user-select:none;animation:gradientFlow 6s linear infinite;display:flex;align-items:center;gap:6px}
.logo::before{content:'◆';font-size:14px;-webkit-text-fill-color:#a78bfa}
@keyframes gradientFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.project-name{background:rgba(255,255,255,.03);border:1px solid transparent;color:var(--text);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;width:160px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.project-name:hover{border-color:var(--border-hi);background:rgba(255,255,255,.05);box-shadow:0 0 20px rgba(124,58,237,.15)}
.project-name:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,.08);box-shadow:0 0 0 4px rgba(124,58,237,.15)}
.spacer{flex:1}
.tb-btn{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;height:38px;transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;font-weight:500;white-space:nowrap}
.tb-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.15));opacity:0;transition:opacity .3s}
.tb-btn:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.2)}
.tb-btn:hover::before{opacity:1}
.tb-btn:active{transform:translateY(0) scale(.98)}
.tb-btn>span,.tb-btn>svg{position:relative;z-index:1}
.tb-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.tb-btn:disabled::before{opacity:0}
.tb-btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;font-weight:600;box-shadow:0 4px 20px rgba(124,58,237,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.tb-btn.primary:hover{box-shadow:0 12px 30px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.15);transform:translateY(-2px) scale(1.02)}
.tb-btn.primary::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:none;pointer-events:none}
.tb-btn.primary:hover::after{animation:shimmer 1s ease forwards}
.tb-btn .kbd-hint{font-size:10px;opacity:.5;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:5px;border:1px solid var(--border);margin-left:2px}
@keyframes shimmer{to{left:200%}}

.segmented{display:flex;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.segmented button{background:transparent;border:none;color:var(--muted);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:14px;transition:all .2s}
.segmented button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.segmented button.active{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff;box-shadow:0 2px 10px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.2);transform:scale(1.05)}

.main{display:flex;height:calc(100vh - 56px)}
.sidebar{width:290px;background:rgba(15,15,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative}
.search-box{padding:10px;border-bottom:1px solid var(--border);position:relative}
.search-box input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:12.5px;transition:all .25s}
.search-box input:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,.08);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.block-list{flex:1;overflow-y:auto;padding:8px}
.cat-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted2);padding:14px 10px 6px;font-weight:800;display:flex;align-items:center;gap:6px}
.cat-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.block-btn{width:100%;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.02);border:1px solid transparent;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:12.5px;text-align:left;margin-bottom:3px;transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.block-btn::before{content:'';position:absolute;left:0;top:0;height:100%;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));transform:scaleY(0);transform-origin:center;transition:transform .3s}
.block-btn:hover{background:linear-gradient(90deg,rgba(124,58,237,.15),rgba(6,182,212,.05));border-color:rgba(124,58,237,.4);transform:translateX(4px);box-shadow:0 6px 20px rgba(124,58,237,.15)}
.block-btn:hover::before{transform:scaleY(1)}
.block-btn:active{transform:translateX(4px) scale(.98)}
.block-btn .ico{font-size:16px;width:24px;height:24px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border-radius:7px;transition:all .3s}
.block-btn:hover .ico{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(6,182,212,.2));transform:scale(1.1) rotate(-5deg)}

.workspace{flex:1;display:flex;flex-direction:column;background:transparent;overflow:hidden;position:relative}
.canvas-wrap{flex:1;overflow:auto;padding:40px;display:flex;justify-content:center;position:relative}
.canvas-wrap::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0),radial-gradient(circle at 1px 1px,rgba(124,58,237,.08) 1px,transparent 0);background-size:20px 20px,100px 100px;pointer-events:none;opacity:.7}
.canvas{width:100%;max-width:1100px;background:#fff;color:#111;border-radius:16px;min-height:100%;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05),0 0 80px rgba(124,58,237,.15);transition:max-width .35s cubic-bezier(.34,1.56,.64,1),transform .3s;position:relative;z-index:1}
.canvas.tablet{max-width:768px}
.canvas.mobile{max-width:400px}
.canvas.empty-state{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#999;padding:80px 20px;min-height:600px}
.canvas.empty-state .em-ico{font-size:90px;margin-bottom:24px;opacity:.5;animation:floatIcon 3s ease-in-out infinite}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-15px) rotate(5deg)}}
.canvas.empty-state h2{color:#333;margin-bottom:10px;font-weight:800;font-size:24px}
.canvas.empty-state p{color:#888;font-size:14px;max-width:400px;text-align:center;line-height:1.6}

.block-item{position:relative;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .2s}
.block-item:hover{outline-color:rgba(124,58,237,.5)}
.block-item.selected{outline:2px solid var(--accent);z-index:5;box-shadow:0 0 0 4px rgba(124,58,237,.15),0 0 40px rgba(124,58,237,.3)}
.block-item.preset-merge-top > *{border-top-width:0!important;border-top-left-radius:0!important;border-top-right-radius:0!important;margin-top:-2px!important}
.block-item.preset-merge-middle > *{border-top-width:0!important;border-bottom-width:0!important;border-radius:0!important;margin-top:-2px!important}
.block-item.preset-merge-bottom > *{border-bottom-width:0!important;border-bottom-left-radius:0!important;border-bottom-right-radius:0!important}

.block-toolbar{position:absolute;top:10px;right:10px;display:none;gap:3px;background:rgba(10,10,18,.9);backdrop-filter:blur(20px);padding:5px;border-radius:12px;z-index:20;align-items:center;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05);transform:translateY(-8px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.block-item:hover .block-toolbar,.block-item.selected .block-toolbar{display:flex;transform:translateY(0);opacity:1}
.block-toolbar button{min-width:32px;height:32px;border:none;background:transparent;color:#ccc;cursor:pointer;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;transition:all .2s cubic-bezier(.34,1.56,.64,1);position:relative;font-family:inherit;white-space:nowrap}
.block-toolbar button:hover{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff;transform:scale(1.08);box-shadow:0 4px 15px rgba(124,58,237,.5)}
.block-toolbar button.del:hover{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 15px rgba(239,68,68,.5)}
.block-toolbar button:active{transform:scale(.96)}
.block-toolbar button .tt{font-size:11px}

.inspector{width:340px;background:rgba(15,15,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.insp-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(124,58,237,.05),transparent)}
.insp-header .inh-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 20px rgba(124,58,237,.4),inset 0 1px 0 rgba(255,255,255,.2);position:relative;overflow:hidden}
.insp-header .inh-ico::after{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.3),transparent);animation:rotate 3s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.insp-header .inh-title{font-weight:700;font-size:14px;letter-spacing:-.2px}
.insp-header .inh-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
.insp-tabs{display:flex;padding:6px;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;background:rgba(0,0,0,.15)}
.insp-tab{background:transparent;border:none;color:var(--muted);padding:9px 8px;border-radius:9px;cursor:pointer;font-size:10.5px;flex:1;min-width:56px;white-space:nowrap;font-weight:600;transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.insp-tab:hover{color:var(--text);background:rgba(255,255,255,.05);transform:translateY(-2px)}
.insp-tab.active{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(6,182,212,.15));color:#fff;box-shadow:0 4px 15px rgba(124,58,237,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.insp-body{flex:1;overflow-y:auto;padding:16px}
.insp-tabpanel{display:none;animation:fadeSlide .3s ease}
.insp-tabpanel.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.insp-empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.insp-empty .em{font-size:56px;margin-bottom:16px;opacity:.3;animation:floatIcon 4s ease-in-out infinite}
.group{margin-bottom:20px;animation:fadeSlide .35s ease}
.group-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted2);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.group-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:12.5px;resize:vertical;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);background:rgba(124,58,237,.08);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.field input[type=color]{width:100%;height:38px;padding:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .25s}
.field input[type=color]:hover{border-color:var(--border-hi);transform:scale(1.02)}
.field input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.field .range-val{background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(6,182,212,.15));border:1px solid rgba(124,58,237,.3);padding:3px 10px;border-radius:6px;font-size:10.5px;color:var(--accent2);font-weight:700;min-width:48px;text-align:center;display:inline-block;font-family:'JetBrains Mono',monospace}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.field.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}
.field.row4 input[type=number]{padding:7px 6px;font-size:11.5px}
.field .upload-btn{background:linear-gradient(135deg,var(--accent),#5b21b6);border:none;color:#fff;padding:9px 12px;border-radius:9px;font-size:11px;cursor:pointer;font-weight:600;transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 12px rgba(124,58,237,.35);display:flex;align-items:center;gap:5px}
.field .upload-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.5)}
.field .url-row{display:flex;gap:6px}

.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:2000;pointer-events:none}
.toast{background:rgba(23,23,37,.9);backdrop-filter:blur(20px);border:1px solid var(--border);color:var(--text);padding:14px 20px;border-radius:12px;font-size:12.5px;display:flex;align-items:center;gap:12px;pointer-events:auto;font-weight:600;min-width:220px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}

.hv-lift{transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s}.hv-lift:hover{transform:translateY(-8px)!important;box-shadow:0 25px 50px rgba(0,0,0,.2)!important}

function snapshot(){return JSON.stringify({blocks:state.blocks,theme:state.theme});}
function pushHistory(){const s=snapshot();if(history.stack[history.index]===s)return;history.stack=history.stack.slice(0,history.index+1);history.stack.push(s);if(history.stack.length>history.max)history.stack.shift();history.index=history.stack.length-1;updateUndo();autoSave();}

function hexAlpha(hex,a){const h=hex.replace('#','');let r,g,b;if(h.length===3){r=parseInt(h[0]+h[0],16);g=parseInt(h[1]+h[1],16);b=parseInt(h[2]+h[2],16);}else{r=parseInt(h.substring(0,2),16);g=parseInt(h.substring(2,4),16);b=parseInt(h.substring(4,6),16);}return 'rgba('+r+','+g+','+b+','+a+')';}

function injectDynamicStyles(){let st=document.getElementById('wb-dyn');if(!st){st=document.createElement('style');st.id='wb-dyn';document.head.appendChild(st);}st.textContent=state.blocks.map(b=>generateBlockCSS(b)).join('\n');}
function injectAnimStyles(){
  if(document.getElementById('wb-anim'))return;
  const css=$$('style').map(s=>s.textContent).join('\n');
  const st=document.createElement('style');st.id='wb-anim';
  const keyframesMatch=css.match(/@keyframes[^}]+\{[\s\S]*?\}\s*\}/g)||[];
  const hvMatch=css.match(/\.hv-[a-z0-9-]+\{[^}]+\}(\.hv-[a-z0-9-]+:hover[^{]*\{[^}]+\})*/g)||[];
  st.textContent=keyframesMatch.join('\n')+'\n'+hvMatch.join('\n');
  document.head.appendChild(st);
}

function renderBlockHTML(b){
  const temp=document.createElement('div');
  temp.innerHTML=buildInnerHTML(b).trim();
  const el=temp.firstElementChild;
  if(!el)return temp.innerHTML;
  const s=b._style||{};
  if(s.hover&&s.hover!=='none')el.classList.add(s.hover);
  return temp.innerHTML;
}
function blockWrapper(b,selected){

    '<div class="block-toolbar">'+

function render(){
  const canvas=$('#canvas');
  canvas.className='canvas';
  if(state.device==='tablet')canvas.classList.add('tablet');
  if(state.device==='mobile')canvas.classList.add('mobile');
  canvas.style.fontFamily=state.theme.font;
  canvas.style.background=state.theme.bg;
  canvas.style.color=state.theme.text;
  if(!state.blocks.length){
    canvas.classList.add('empty-state');
    canvas.innerHTML='<div class="em-ico">🎨</div><h2>'+esc(t('emptyTitle'))+'</h2><p>'+esc(t('emptyTip'))+'</p>';
    injectDynamicStyles();
    return;
  }
  canvas.innerHTML=state.blocks.map(b=>blockWrapper(b,b.id===state.selectedBlockId)).join('');
  injectDynamicStyles();
  applyPresetMerging(canvas);
  wireCanvas(canvas);
}
function applyPresetMerging(canvas){
  const items=$$('.block-item',canvas);
  items.forEach((el,i)=>{
    el.classList.remove('preset-merge-top','preset-merge-middle','preset-merge-bottom');
    const thisB=state.blocks.find(b=>b.id===el.dataset.id);
    if(!thisB)return;
    const thisVp=(thisB._style||{}).visualPreset||'';
    if(!thisVp)return;
    const prev=items[i-1]?state.blocks.find(b=>b.id===items[i-1].dataset.id):null;
    const next=items[i+1]?state.blocks.find(b=>b.id===items[i+1].dataset.id):null;
    const prevVp=prev?((prev._style||{}).visualPreset||''):'';
    const nextVp=next?((next._style||{}).visualPreset||''):'';
    const mt=prevVp===thisVp,mb=nextVp===thisVp;
    if(mt&&mb)el.classList.add('preset-merge-middle');
    else if(mt)el.classList.add('preset-merge-top');
    else if(mb)el.classList.add('preset-merge-bottom');
  });
}
function wireCanvas(canvas){
  $$('.block-item',canvas).forEach(el=>{
    const id=el.dataset.id;
    el.addEventListener('click',e=>{
      if(e.target.closest('.block-toolbar'))return;
      if(e.target.closest('a,button,input,textarea,details,summary'))return;
      state.selectedBlockId=id;render();renderInspector();
    });
    $$('.block-toolbar button[data-act]',el).forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const a=btn.dataset.act;
        if(a==='up')moveBlock(id,-1);
        else if(a==='down')moveBlock(id,1);
        else if(a==='dup')dupBlock(id);
        else if(a==='copy'){clipboard=deepCopy(state.blocks.find(b=>b.id===id));toast(t('toastCopied'),'info');}
        else if(a==='del')delBlock(id);
      });
    });
  });
  $$('.b-tabs',canvas).forEach(tabs=>{
    $$('.b-tab-btn',tabs).forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const i=btn.dataset.tabI;
        $$('.b-tab-btn',tabs).forEach(b=>{const a=b.dataset.tabI===i;b.classList.toggle('active',a);b.style.color=a?state.theme.primary:'';b.style.borderBottomColor=a?state.theme.primary:'';});
        $$('.b-tab-panel',tabs).forEach(p=>{p.style.display=p.dataset.tabP===i?'block':'none';});
      });
    });
  });
  $$('.b-countdown',canvas).forEach(el=>{
    const target=new Date(el.dataset.date).getTime();
    if(isNaN(target))return;
    if(el._timer)clearInterval(el._timer);
    const upd=()=>{const d=target-Date.now();if(d<=0)return;const dd=el.querySelector('.cd-d'),hh=el.querySelector('.cd-h'),mm=el.querySelector('.cd-m'),ss=el.querySelector('.cd-s');if(dd)dd.textContent=String(Math.floor(d/86400000)).padStart(2,'0');if(hh)hh.textContent=String(Math.floor(d/3600000)%24).padStart(2,'0');if(mm)mm.textContent=String(Math.floor(d/60000)%60).padStart(2,'0');if(ss)ss.textContent=String(Math.floor(d/1000)%60).padStart(2,'0');};
    upd();el._timer=setInterval(upd,1000);
  });
}
function addBlock(type){
  const def=BLOCKS[type];
  if(!def)return;
  const b=def.defaults();
  b.type=type;b.id=uid();b._style={};
  state.blocks.push(b);
  state.selectedBlockId=b.id;
  render();renderInspector();pushHistory();
  toast('«'+blockName(type)+'» '+t('toastAdded'),'success');
}
function delBlock(id){const i=state.blocks.findIndex(b=>b.id===id);if(i<0)return;state.blocks.splice(i,1);if(state.selectedBlockId===id)state.selectedBlockId=null;render();renderInspector();pushHistory();toast(t('toastDeleted'),'info');}
function dupBlock(id){const i=state.blocks.findIndex(b=>b.id===id);if(i<0)return;const c=deepCopy(state.blocks[i]);c.id=uid();state.blocks.splice(i+1,0,c);state.selectedBlockId=c.id;render();renderInspector();pushHistory();toast(t('toastDup'),'success');}
function moveBlock(id,dir){const i=state.blocks.findIndex(b=>b.id===id);if(i<0)return;const n=i+dir;if(n<0||n>=state.blocks.length)return;const tmp=state.blocks[i];state.blocks[i]=state.blocks[n];state.blocks[n]=tmp;render();pushHistory();}

function renderSidebar(filter){
  filter=filter||'';
  const f=filter.trim().toLowerCase();
  const list=$('#blockList');
  if(!list)return;
  let html='';
  CATEGORIES.forEach(cat=>{
    const items=Object.entries(BLOCKS).filter(x=>x[1].cat===cat&&(!f||blockName(x[0]).toLowerCase().includes(f)||x[1].name.toLowerCase().includes(f)));
    if(!items.length)return;
    html+='<div class="cat-title">'+esc(catName(cat))+'</div>';
    items.forEach(x=>{html+='<button class="block-btn" data-add="'+x[0]+'"><span class="ico">'+x[1].icon+'</span>'+esc(blockName(x[0]))+'</button>';});
  });
  list.innerHTML=html;
  $$('[data-add]',list).forEach(b=>b.onclick=()=>addBlock(b.dataset.add));
}

  $$('.insp-tab',insp).forEach(tb=>{tb.onclick=()=>{currentTab=tb.dataset.itab;$$('.insp-tab',insp).forEach(x=>x.classList.toggle('active',x===tb));$$('.insp-tabpanel',insp).forEach(p=>p.classList.toggle('active',p.dataset.ipanel===currentTab));};});

function renderContentPanel(b,def){
  let html='<div class="group"><div class="group-title">'+t('groupContent')+'</div>';
  for(const f of def.content)html+=renderField(b,f);
  html+='</div>';
  return html;

  $$('[data-typo-color]',insp).forEach(sw=>sw.onclick=()=>{b._style=b._style||{};b._style.color=sw.dataset.typoColor;render();renderInspector();pushHistory();});
  $$('[data-typo-v]',insp).forEach(btn=>btn.onclick=()=>{b._style=b._style||{};const v=btn.dataset.typoV;if(v==='')delete b._style.align;else b._style.align=v;render();renderInspector();pushHistory();});

  $$('[data-textshadow]',insp).forEach(btn=>btn.onclick=()=>{b._style=b._style||{};b._style.textShadow=btn.dataset.textshadow;render();renderInspector();pushHistory();});
  $$('[data-tg]',insp).forEach(inp=>{const h=()=>{b._style=b._style||{};const k=inp.dataset.tg;if(k==='c1')b._style.textGradientC1=inp.value;else if(k==='c2')b._style.textGradientC2=inp.value;else if(k==='angle')b._style.textGradientAngle=+inp.value;render();if(k==='angle'){const v=inp.parentElement.querySelector('.range-val');if(v)v.textContent=inp.value+'°';}scheduleHistory();};inp.addEventListener('input',h);inp.addEventListener('change',h);});

function pickImage(cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cb(r.result);toast(t('toastUpload'),'success');};r.readAsDataURL(f);};
  inp.click();
}
function toast(msg,type){
  type=type||'info';
  const c=$('#toastContainer');
  const el=document.createElement('div');
  el.className='toast '+type;
  const icons={success:'✓',error:'✕',info:'ℹ',warn:'⚠'};
  el.innerHTML='<span>'+icons[type]+'</span> '+esc(msg);
  c.appendChild(el);
  setTimeout(()=>{el.style.transition='all .35s';el.style.opacity='0';el.style.transform='translateX(120%) scale(.9)';setTimeout(()=>el.remove(),350);},2400);
}
let _saveTimer=null;
function scheduleHistory(){clearTimeout(_saveTimer);_saveTimer=setTimeout(pushHistory,500);}
function autoSave(){try{localStorage.setItem('wb_project',JSON.stringify({blocks:state.blocks,theme:state.theme,projectName:state.projectName}));}catch(e){}}
function loadLocal(){
  try{
    const d=JSON.parse(localStorage.getItem('wb_project')||'null');
    if(d&&Array.isArray(d.blocks)){
      state.blocks=d.blocks;
      state.theme=Object.assign({},defaultTheme,d.theme||{});
      state.projectName=d.projectName||'Мой проект';
      const pn=$('#projectName');if(pn)pn.value=state.projectName;
      return true;
    }
  }catch(e){}
  return false;
}
function buildDemo(){
  const types=['navMega','heroGradient','logos','features','stats','imageText','pricing','testimonialBig','faq','ctaBanner','footerBig'];
  return types.map(tp=>{const b=BLOCKS[tp].defaults();b.type=tp;b.id=uid();b._style={};return b;});
}
function crc32Table(){if(window._crc)return window._crc;const t=[];for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c;}window._crc=t;return t;}
function crc32(bytes){const t=crc32Table();let c=0^(-1);for(let i=0;i<bytes.length;i++)c=(c>>>8)^t[(c^bytes[i])&0xFF];return (c^(-1))>>>0;}
function makeZip(files){
  const enc=new TextEncoder();
  const chunks=[];const cd=[];let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name);const cb=enc.encode(f.content);const crc=crc32(cb);const sz=cb.length;
    const h=new Uint8Array(30+nb.length);const hv=new DataView(h.buffer);
    hv.setUint32(0,0x04034b50,true);hv.setUint16(4,20,true);hv.setUint16(6,0,true);hv.setUint16(8,0,true);hv.setUint16(10,0,true);hv.setUint16(12,0,true);hv.setUint32(14,crc,true);hv.setUint32(18,sz,true);hv.setUint32(22,sz,true);hv.setUint16(26,nb.length,true);hv.setUint16(28,0,true);h.set(nb,30);
    chunks.push(h,cb);
    const c=new Uint8Array(46+nb.length);const cv=new DataView(c.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint8(8,0);cv.setUint8(9,0);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);c.set(nb,46);
    cd.push(c);off+=h.length+cb.length;
  });
  const cdSize=cd.reduce((a,c)=>a+c.length,0);
  const e=new Uint8Array(22);const ev=new DataView(e.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  return new Blob([...chunks,...cd,e],{type:'application/zip'});
}
function collectSiteCSS(){
  const styles=$$('style').map(s=>s.textContent).join('\n');
  const parts=styles.split('/* ===== BLOCK BASE STYLES ===== */');
  if(parts.length<2)return styles;
  const baseAndMedia=parts[1];
  const animIdx=baseAndMedia.indexOf('@keyframes anim-fadeIn');
  if(animIdx>0)return baseAndMedia.substring(0,animIdx);
  return baseAndMedia;
}
function buildSiteHTML(){
  const th=state.theme;
  const body=state.blocks.map(b=>renderBlockHTML(b)).join('\n');
  const blockCSS=state.blocks.map(b=>generateBlockCSS(b)).join('\n');
  const customCSS=state.blocks.filter(b=>b.type==='custom'&&b.css).map(b=>b.css).join('\n');
  const animEl=document.getElementById('wb-anim');
  const animCSS=animEl?animEl.textContent:'';
  const siteCSS=collectSiteCSS();
  return '<!DOCTYPE html>\n<html lang="ru">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+esc(state.projectName)+'</title>\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Lora:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'+th.font+';color:'+th.text+';background:'+th.bg+';line-height:1.6;max-width:'+th.maxWidth+'px;margin:0 auto;overflow-x:hidden}\nimg{max-width:100%;display:block}\na{color:inherit}\n'+siteCSS+'\n'+animCSS+'\n'+blockCSS+'\n'+customCSS+'\n</style>\n</head>\n<body>\n'+body+'\n</body>\n</html>';
}
function exportZIP(){
  const html=buildSiteHTML();
  const files=[{name:'index.html',content:html},{name:'README.txt',content:'Сайт «'+state.projectName+'»\nСоздано в WebBuilder Ultra Visual Edition\n\nОткрой index.html двойным кликом в браузере.'}];
  const blob=makeZip(files);
  const filename=(state.projectName||'site').replace(/[^\wа-яА-Я\-]+/g,'_')+'.zip';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(t('toastZip'),'success');
}
function previewSite(){
  const w=window.open('','_blank');
  if(!w){toast(t('toastPopup'),'warn');return;}
  w.document.write(buildSiteHTML());
  w.document.close();
}

function applyLang(){
  document.documentElement.lang=LANG;
  $$('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(v)el.textContent=v;});
  $$('[data-i18n-ph]').forEach(el=>{const v=t(el.dataset.i18nPh);if(v)el.placeholder=v;});
  $$('[data-i18n-title]').forEach(el=>{const v=t(el.dataset.i18nTitle);if(v)el.title=v;});
  const bs=$('#blockSearch');if(bs)renderSidebar(bs.value);
  renderInspector();
}
function setLang(l){
  LANG=l;
  $$('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  applyLang();
}
function bootApp(){
  injectAnimStyles();
  renderSidebar();
  history.stack=[];history.index=-1;
  pushHistory();
  render();
  renderInspector();
  updateUndo();
}
function init(){
  $$('.lang-btn').forEach(btn=>btn.onclick=()=>setLang(btn.dataset.lang));
  $$('.opt-btn').forEach(btn=>btn.onclick=()=>{
    $$('.opt-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
  $('#launchBtn').onclick=()=>{
    const active=document.querySelector('.opt-btn.active');
    const mode=active?active.dataset.start:'empty';
    if(mode==='restore'){const ok=loadLocal();if(!ok){state.blocks=[];}}
    else if(mode==='demo'){state.blocks=buildDemo();}
    else {state.blocks=[];}
    applyLang();
    const splash=$('#splash');
    splash.classList.add('hide');
    setTimeout(()=>{splash.style.display='none';},520);
    bootApp();
  };
  $('#blockSearch').addEventListener('input',e=>renderSidebar(e.target.value));
  $('#projectName').addEventListener('input',e=>{state.projectName=e.target.value;scheduleHistory();});
  $('#undoBtn').onclick=undo;
  $('#redoBtn').onclick=redo;
  $('#exportBtn').onclick=exportZIP;
  $('#previewBtn').onclick=previewSite;
  $$('#deviceSwitch button').forEach(btn=>btn.onclick=()=>{
    $$('#deviceSwitch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.device=btn.dataset.dev;
    render();
  });
  document.addEventListener('keydown',e=>{
    const inInput=e.target.matches('input, textarea, select, [contenteditable]');
    if(e.ctrlKey||e.metaKey){
      if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
      else if(e.key==='y'){e.preventDefault();redo();}
      else if(e.key==='v'&&clipboard&&!inInput){e.preventDefault();const c=deepCopy(clipboard);c.id=uid();const i=state.blocks.findIndex(b=>b.id===state.selectedBlockId);const at=i>=0?i+1:state.blocks.length;state.blocks.splice(at,0,c);state.selectedBlockId=c.id;render();renderInspector();pushHistory();toast(t('toastPasted'),'success');}
      else if(e.key==='c'&&state.selectedBlockId&&!inInput){e.preventDefault();clipboard=deepCopy(state.blocks.find(b=>b.id===state.selectedBlockId));toast(t('toastCopied'),'info');}
    }else if(e.key==='Delete'&&state.selectedBlockId&&!inInput){e.preventDefault();delBlock(state.selectedBlockId);}
  });
  applyLang();
}
init();
</script>
